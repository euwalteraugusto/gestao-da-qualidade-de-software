# Configuração do projeto no SonarQube/SonarCloud (usada pelo scanner CLI; o sonar-maven-plugin lê o pom.xml).
sonar.projectKey=gqs-aula-11-analise-estatica
sonar.projectName=GQS Aula 11 - Análise Estática
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# Cobertura gerada pelo JaCoCo (mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# O pacote "antes" tem code smells intencionais (material didático). Na 1ª análise (Atividade 2) ele
# DEVE aparecer no dashboard; no CI (workflow aula-11-sonar.yml) é excluído com -Dsonar.exclusions
# para o Quality Gate não falhar por código que existe só para comparação.
# sonar.exclusions=**/antes/**

# SonarCloud: informe a organização (ou passe -Dsonar.organization=...)
# sonar.organization=SUA_ORGANIZACAO
# sonar.host.url=https://sonarcloud.io     # SonarQube local: http://localhost:9000
# O token NUNCA vai neste arquivo: use -Dsonar.token=... ou a variável de ambiente SONAR_TOKEN.
