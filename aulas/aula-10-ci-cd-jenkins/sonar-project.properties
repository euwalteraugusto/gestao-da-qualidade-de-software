# Configuração do scanner (usada pelo workflow aula-10-quality-gate.yml).
# Regras do Quality Gate (cobertura >= 80%, 0 bugs críticos, dívida técnica < 1h) ficam no servidor Sonar.
sonar.projectKey=gqs-aula-10-ci-cd
sonar.projectName=GQS Aula 10 - CI/CD
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.source=17
sonar.sourceEncoding=UTF-8
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Para SonarCloud acrescente (valor da sua organização):
# sonar.organization=SUA_ORGANIZACAO
