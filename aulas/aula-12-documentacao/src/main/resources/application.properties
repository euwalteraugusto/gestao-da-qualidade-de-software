spring.application.name=aula-12-documentacao
server.port=8080
# Erros de validação também no formato ProblemDetail (RFC 9457)
spring.mvc.problemdetails.enabled=true
# Swagger UI em http://localhost:8080/swagger-ui.html (redireciona para /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs
