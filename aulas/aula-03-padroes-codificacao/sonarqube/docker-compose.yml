# SonarQube local (tarefa da Aula 3). NAO EXECUTADO: a maquina onde a aula foi feita nao tem Docker.
# Uso (em quem tiver Docker):
#   docker compose -f sonarqube/docker-compose.yml up -d
#   abrir http://localhost:9000 (login inicial admin/admin: o SonarQube exige trocar a senha)
#   criar um token em My Account > Security e rodar, na pasta da aula:
#   mvn -B verify sonar:sonar -Dsonar.token=<SEU_TOKEN> -Dsonar.host.url=http://localhost:9000
# Linux: pode ser preciso `sudo sysctl -w vm.max_map_count=262144` (exigencia do Elasticsearch embutido).
services:
  sonarqube:
    image: sonarqube:10.6-community
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_local_dev
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_local_dev
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
