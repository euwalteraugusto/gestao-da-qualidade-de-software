spring:
  application:
    name: projeto-final
  profiles:
    # Sem perfil explicito usa "dev" (local e testes). Producao: SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    url: jdbc:h2:mem:produtos;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # Desligado a partir da aula 18: com Spring Security o console exigiria liberar
      # frames e CSRF; use o Swagger/API para inspecionar dados.
      enabled: false

app:
  frete:
    valor-minimo-frete-gratis: 100.00
    valor-fixo: 15.00
  viacep:
    url: https://viacep.com.br/ws
    timeout: 3s
  health:
    # CEP consultado pelo ApiExternaHealthIndicator
    # entre aspas: sem elas o YAML 1.1 leria 01001000 como numero octal
    cep-referencia: '01001000'
  jwt:
    # Obrigatorio fora do perfil dev: variavel de ambiente JWT_SECRET (>= 32 bytes)
    secret: ${JWT_SECRET:}
    issuer: projeto-final
    access-expiration: 15m
    refresh-expiration: 7d
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:}
    cliente:
      username: ${CLIENTE_USERNAME:cliente}
      password-hash: ${CLIENTE_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # dev: detalhes sempre visiveis (slide). Em prod: when-authorized + ADMIN (application-prod.yml)
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: '@project.artifactId@'
    version: '@project.version@'
    description: API de Produtos - Projeto Final IQS
    java: '@java.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
