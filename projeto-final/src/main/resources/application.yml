spring:
  application:
    name: projeto-final
  profiles:
    # Sem perfil explicito usa "dev" (local e testes). Producao: SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    url: jdbc:h2:mem:produtos;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # Desligado a partir da aula 18: com Spring Security o console exigiria liberar
      # frames e CSRF; use o Swagger/API para inspecionar dados.
      enabled: false

app:
  frete:
    valor-minimo-frete-gratis: 100.00
    valor-fixo: 15.00
  viacep:
    url: https://viacep.com.br/ws
    timeout: 3s
  jwt:
    # Obrigatorio fora do perfil dev: variavel de ambiente JWT_SECRET (>= 32 bytes)
    secret: ${JWT_SECRET:}
    issuer: projeto-final
    access-expiration: 15m
    refresh-expiration: 7d
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:}
    cliente:
      username: ${CLIENTE_USERNAME:cliente}
      password-hash: ${CLIENTE_PASSWORD_HASH:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
