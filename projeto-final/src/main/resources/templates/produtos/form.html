<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Produto</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/cabecalho :: cabecalho}"></header>
<main>
    <h1>Novo produto</h1>
    <form class="cartao" th:action="@{/produtos/cadastrar}" th:object="${form}" method="post" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" th:field="*{nome}" type="text" maxlength="120">
        <p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>

        <label for="preco">Preco (R$)</label>
        <input id="preco" th:field="*{preco}" type="number" step="0.01" min="0.01">
        <p class="erro" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></p>

        <div class="acoes">
            <button class="botao" type="submit">Salvar</button>
            <a class="botao secundario" th:href="@{/produtos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
