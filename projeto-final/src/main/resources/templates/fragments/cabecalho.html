<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<body>
<header th:fragment="cabecalho">
    <a th:href="@{/produtos}">Produtos</a>
    <a th:href="@{/cep}">Consulta CEP</a>
    <a th:href="@{/swagger-ui.html}">API (Swagger)</a>
    <span class="usuario" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">usuario</span>
        (<span sec:authorize="hasRole('ADMIN')">admin</span><span sec:authorize="!hasRole('ADMIN')">cliente</span>)
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="botao secundario" type="submit">Sair</button>
        </form>
    </span>
</header>
</body>
</html>
