name: Projeto Final - CI

# Fluxo (aula 15): Commit -> Build -> Testes (unitarios + integracao + Testcontainers)
# -> cobertura JaCoCo >= 80% (falha o build se menor) -> [main] Deploy em staging (Heroku).
# A analise SonarQube fica em projeto-final-sonar.yml (condicionada ao secret SONAR_TOKEN).
on:
  push:
    paths:
      - 'projeto-final/**'
      - '.github/workflows/projeto-final-ci.yml'
  pull_request:
    paths:
      - 'projeto-final/**'
      - '.github/workflows/projeto-final-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto-final
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Docker disponivel para Testcontainers
        run: docker version --format '{{.Server.Version}}'

      - name: Build, testes e verificacao de cobertura (mvn verify)
        run: mvn -B clean verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: projeto-final/target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projeto-final/target/site/jacoco/
          if-no-files-found: ignore

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: projeto-final-jar
          path: projeto-final/target/projeto-final.jar

  deploy-heroku:
    # Tarefa pos-aula 15: estagio de deploy (somente na main e somente se houver secrets).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Aviso (sem secrets do Heroku)
        if: env.HEROKU_API_KEY == '' || env.HEROKU_APP_NAME == ''
        run: echo "::notice::HEROKU_API_KEY/HEROKU_APP_NAME nao configurados - deploy pulado."

      - name: Baixar jar do build
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        uses: actions/download-artifact@v4
        with:
          name: projeto-final-jar
          path: dist

      - name: Deploy no Heroku (heroku deploy:jar)
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        run: |
          command -v heroku >/dev/null || curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku plugins:install java
          # perfil prod via config var SPRING_PROFILES_ACTIVE=prod no Heroku (porta lida de $PORT)
          heroku deploy:jar dist/projeto-final.jar --app "$HEROKU_APP_NAME" --jdk 17

      # Aula 19: smoke test do deploy via Actuator (so se a variable HEROKU_APP_URL existir)
      - name: Smoke test /actuator/health
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != '' && vars.HEROKU_APP_URL != ''
        env:
          APP_URL: ${{ vars.HEROKU_APP_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$APP_URL/actuator/health" | grep -q '"status":"UP"'; then echo "App UP"; exit 0; fi
            sleep 20
          done
          echo "::error::Health check falhou em $APP_URL/actuator/health"; exit 1
