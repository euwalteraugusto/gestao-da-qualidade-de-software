# Aula 9 - Atividade 2: validação automática de Pull Requests.
# Correções em relação ao slide: checkout/setup-java v3 -> v4, distribuição temurin explícita,
# cache do Maven, paths filter (monorepo) e working-directory padrão da aula.
name: Aula 09 - PR Validation

on:
  pull_request:
    paths:
      - 'aulas/aula-09-git-flow-code-review/**'
      - '.github/workflows/aula-09-pr-validation.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: aulas/aula-09-git-flow-code-review

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify = compila, roda os testes, gera JaCoCo e aplica a regra de 100% da NotificacaoService
      - name: Build, testes e cobertura
        run: mvn -B -ntp clean verify

      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aula-09-jacoco
          path: aulas/aula-09-git-flow-code-review/target/site/jacoco
          if-no-files-found: ignore
