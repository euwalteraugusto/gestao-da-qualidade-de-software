name: Aula 02 - Java CI

on:
  push:
    paths:
      - 'aulas/aula-02-*/**'
      - '.github/workflows/aula-02-ci.yml'
  pull_request:
    paths:
      - 'aulas/aula-02-*/**'
      - '.github/workflows/aula-02-ci.yml'
  workflow_dispatch:

# O repositório tem várias aulas (um projeto Maven por pasta).
# Este workflow só roda quando a Aula 02 muda e executa dentro da pasta dela.
defaults:
  run:
    working-directory: aulas/aula-02-metodologias-ageis-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: aulas/aula-02-metodologias-ageis-ci/pom.xml

      - name: Build and Test with Maven
        run: mvn -B clean test

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire-aula-02
          path: aulas/aula-02-metodologias-ageis-ci/target/surefire-reports/
