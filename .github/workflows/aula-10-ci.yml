# Aula 10 - Atividade 1: pipeline CI completo (build, testes, Checkstyle, PMD, JaCoCo e gate de cobertura).
# Correções em relação ao slide: actions v3 -> v4; "mvn clean package" já rodava os testes e depois
# "mvn test" rodava de novo (duplicado) -> build com -DskipTests; JaCoCo e PMD adicionados (exercício);
# paths filter + working-directory (monorepo); cache do Maven; permissions mínimas.
name: Aula 10 - Java CI Pipeline

on:
  push:
    paths:
      - 'aulas/aula-10-ci-cd-jenkins/**'
      - '.github/workflows/aula-10-ci.yml'
  pull_request:
    paths:
      - 'aulas/aula-10-ci-cd-jenkins/**'
      - '.github/workflows/aula-10-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: aulas/aula-10-ci-cd-jenkins

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configura ambiente Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Etapa de build (sem testes: eles têm etapa própria)
      - name: Build with Maven
        run: mvn -B -ntp clean package -DskipTests

      # Etapa de testes unitários (gera target/jacoco.exec e o relatório JaCoCo)
      - name: Run Unit Tests
        run: mvn -B -ntp test

      # Verificação de estilo: falha o build se encontrar erros
      - name: Code Quality Check (Checkstyle)
        run: mvn -B -ntp checkstyle:check
        continue-on-error: false

      # Análise estática de bugs e más práticas
      - name: Static Analysis (PMD)
        run: mvn -B -ntp pmd:check

      # Quality gate de cobertura (mínimo 85% de linhas e ramos), usando o jacoco.exec do passo de testes
      - name: Coverage Gate (JaCoCo)
        run: mvn -B -ntp jacoco:check@check

      - name: Publicar relatórios (JaCoCo, Checkstyle, PMD, JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aula-10-relatorios
          path: |
            aulas/aula-10-ci-cd-jenkins/target/site/jacoco
            aulas/aula-10-ci-cd-jenkins/target/checkstyle-result.xml
            aulas/aula-10-ci-cd-jenkins/target/pmd.xml
            aulas/aula-10-ci-cd-jenkins/target/surefire-reports
          if-no-files-found: ignore
